server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: h2
  jackson:
    serialization:
      INDENT_OUTPUT: true

  # Log all DB queries (Hibernate + Spring JDBC)
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # Hibernate SQL statements
    org.hibernate.SQL: DEBUG
    # Hibernate 6 bind parameters
    org.hibernate.orm.jdbc.bind: TRACE
    # Spring JDBC (JdbcTemplate) SQL + bind parameters
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

app:
  readOnly: true
  # Simple hard blocks at the app layer (DB role should also be read-only)
  disallowSqlKeywords:
    - INSERT
    - UPDATE
    - DELETE
    - DROP
    - ALTER
    - TRUNCATE
    - CREATE
    - GRANT
    - REVOKE
  defaultMaxRows: 200
  defaultQueryTimeoutSeconds: 20
  # Optional allowlist. Empty = allow all tables. Put names like: ["dbo.customers","dbo.orders"]
  # Optional: limit what /api/schema (and later NLQ) exposes
  allowTables:
    - dbo.customers
    - dbo.products
    - dbo.orders
    - dbo.order_items
  # How many distinct sample values per column to fetch
  schemaSamplesPerColumn: 5

  nlqProvider: ${APP_NLQ_PROVIDER:rule}
  nlqMode: ${APP_NLQ_MODE:judge-generator} # "single-call" or "judge-generator"
  azureOpenaiEndpoint: ${APP_AZURE_ENDPOINT:}
  azureOpenaiDeployment: ${APP_AZURE_DEPLOYMENT:}
  azureOpenaiApiVersion: ${APP_AZURE_API_VERSION:}
  azureOpenaiApiKey: ${APP_AZURE_API_KEY:}

  # Conversation history settings
  historyEnabled: ${APP_HISTORY_ENABLED:true}
  historyMaxTurns: ${APP_HISTORY_MAX_TURNS:6}
  historyTtlMinutes: ${APP_HISTORY_TTL_MINUTES:1440}

  # Phase 0 chat shell settings
  chatSystemPrompt: ${APP_CHAT_SYSTEM_PROMPT:You are a helpful assistant for a clothes store application. Be concise.}
  chatDefaultTemperature: ${APP_CHAT_DEFAULT_TEMPERATURE:0.2}