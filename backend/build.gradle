plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.1.0'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Optional: use Reactor types (Mono/Flux) with Spring MVC async support.
    implementation 'io.projectreactor:reactor-core'

    runtimeOnly 'com.h2database:h2'

    // Microsoft SQL Server JDBC driver (pick ONE of these)
    // Preferred (latest):
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:13.2.0.jre11'
    // Or if you need to pin to 12.x:
    // runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

bootRun {
    if (project.hasProperty('debug')) {
        def debugPort = project.findProperty('debugPort') ?: '5005'
        jvmArgs = ["-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${debugPort}"]
    }
}
